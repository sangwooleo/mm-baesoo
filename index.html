<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="mm계산기"><link rel="manifest" href="./manifest.json"><title>mm 배수계산기</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px 14px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#111827}main{max-width:650px;margin:auto}h1{font-size:27px;margin:0 0 5px}.muted{color:#6b7280;font-size:14px}label{display:block;font-size:17px;font-weight:700;margin:22px 0 8px}input{width:100%;font-size:30px;font-weight:700;padding:15px;border:2px solid #d1d5db;border-radius:14px}button{border:0;border-radius:13px;padding:15px;font-size:16px;font-weight:750;min-height:50px}.actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0}.primary{background:#111827;color:white}.secondary,.item{background:#f3f4f6;color:#111827}.summary{background:#eff6ff;padding:15px;border-radius:14px;margin:16px 0}.summary small{display:block;color:#1d4ed8;margin-bottom:5px}.summary strong{font-size:29px}h2{font-size:19px}#results{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{text-align:left;width:100%;padding:12px;min-width:0}.n{color:#6b7280;font-size:13px;margin-bottom:5px}.v{font-size:21px;font-weight:800;overflow-wrap:anywhere}.u{color:#6b7280;font-size:12px;margin-top:4px}@media(min-width:480px){#results{grid-template-columns:repeat(3,1fr)}}#status{font-size:13px;color:#6b7280;text-align:center;margin:18px 0}
</style></head><body><main><h1>mm 배수계산기</h1><div class="muted">기준 숫자 × 1배부터 100배까지</div><label for="base">기준 숫자 (mm)</label><input id="base" type="number" inputmode="decimal" min="0" step="any" placeholder="예: 1200"><div class="actions"><button class="primary" id="copy">전체 결과 복사</button><button class="secondary" id="clear">초기화</button></div><div class="summary"><small>100배 결과</small><strong id="hundred">— mm</strong></div><h2>계산 결과 <span class="muted">· 항목을 누르면 값 복사</span></h2><div id="results"></div><div id="status">인터넷 연결 없이도 계산할 수 있도록 구성되어 있습니다.</div></main>
<script>
const input=document.querySelector('#base'),results=document.querySelector('#results'),hundred=document.querySelector('#hundred'),status=document.querySelector('#status');
const fmt=n=>Number(n.toFixed(6)).toLocaleString('en-US',{maximumFractionDigits:6});
function render(){results.replaceChildren();let raw=input.value.trim(),x=Number(raw);if(raw===''||!Number.isFinite(x)||x<0||x>1e12){hundred.textContent='— mm';return}hundred.textContent=fmt(x*100)+' mm';let f=document.createDocumentFragment();for(let i=1;i<=100;i++){let b=document.createElement('button');b.className='item';b.innerHTML='<div class="n">'+i+'배</div><div class="v">'+fmt(x*i)+'</div><div class="u">mm · 눌러서 복사</div>';b.onclick=()=>copy(fmt(x*i),'값을 복사했습니다.');f.appendChild(b)}results.appendChild(f)}
async function copy(t,msg){try{if(navigator.clipboard&&isSecureContext)await navigator.clipboard.writeText(t);else{let e=document.createElement('textarea');e.value=t;e.style.position='fixed';e.style.opacity='0';document.body.appendChild(e);e.select();if(!document.execCommand('copy'))throw Error();e.remove()}status.textContent=msg}catch(e){status.textContent='복사 실패: 브라우저 권한을 확인해 주세요.'}}
input.addEventListener('input',render);document.querySelector('#copy').onclick=()=>{let raw=input.value.trim(),x=Number(raw);if(raw===''||!Number.isFinite(x)||x<0||x>1e12){status.textContent='먼저 숫자를 입력해 주세요.';return}copy(Array.from({length:100},(_,i)=>(i+1)+'배\t'+fmt(x*(i+1))+' mm').join('\n'),'100개 결과를 복사했습니다.')};document.querySelector('#clear').onclick=()=>{input.value='';render();input.focus();status.textContent='초기화했습니다.'};render();
</script></body></html>
