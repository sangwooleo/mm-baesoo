<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="mm계산기"><link rel="manifest" href="./manifest.json"><title>mm 배수계산기</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#111827}
main{max-width:650px;margin:auto}
h1{font-size:24px;margin:0 0 12px}
label{display:block;font-size:15px;font-weight:700;margin:12px 0 7px}
input{width:100%;font-size:28px;font-weight:700;padding:12px;border:2px solid #d1d5db;border-radius:12px}
button{border:0;border-radius:11px;padding:12px;font-size:15px;font-weight:750;min-height:46px}
.actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin:9px 0 12px}
.secondary{background:#f3f4f6;color:#111827}
#results{display:flex;flex-direction:column;gap:5px}
.item{background:#f3f4f6;color:#111827;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-radius:11px}
.n{color:#6b7280;font-size:14px;flex:0 0 42px}
.v{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;text-align:right}
#status{font-size:12px;color:#6b7280;text-align:center;margin:12px 0}
</style></head><body><main><h1>mm 배수계산기</h1>
<label for="base">기준 숫자 (mm)</label>
<input id="base" type="number" inputmode="decimal" min="0" step="any" placeholder="숫자 입력">
<div class="actions"><button class="secondary" id="clear">초기화</button></div>
<div id="results"></div></main>
<script>
const input=document.querySelector('#base'),results=document.querySelector('#results');
const fmt=n=>Number(n.toFixed(6)).toLocaleString('en-US',{maximumFractionDigits:6});
function render(){
  results.replaceChildren();
  const raw=input.value.trim(),x=Number(raw);
  if(raw===''||!Number.isFinite(x)||x<0||x>1e12)return;
  const f=document.createDocumentFragment();
  for(let i=1;i<=100;i++){
    const b=document.createElement('div');
    b.className='item';
    b.innerHTML='<span class="n">'+i+'배</span><span class="v">'+fmt(x*i)+'</span>';
    f.appendChild(b);
  }
  results.appendChild(f);
}
input.addEventListener('input',render);
document.querySelector('#clear').onclick=()=>{input.value='';render();input.focus()};
render();
</script></body></html>
